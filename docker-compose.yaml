version: '3.8'

services:
  init-render:
    image: mikefarah/yq:4
    container_name: authz-init-render
    user: root
    working_dir: /work
    volumes:
      - ./:/work
    entrypoint: ""
    command: ["/bin/sh", "scripts/render_init.sh"]

  postgres:
    image: postgres:15
    container_name: authz-postgres
    environment:
      POSTGRES_USER: authz
      POSTGRES_PASSWORD: authz123
      POSTGRES_DB: authz
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=4"
      - "-c"
      - "max_wal_senders=4"
    ports:
      - "5432:5432"
    depends_on:
      init-render:
        condition: service_completed_successfully
    volumes:
      - ./generated/init.sql:/docker-entrypoint-initdb.d/00_init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authz"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: authz-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: authz-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  debezium:
    image: debezium/connect:2.4
    container_name: authz-debezium
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_statuses
      BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_LOG4J_ROOT_LOGLEVEL: WARN
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 10s
      retries: 5

  connector-init:
    image: curlimages/curl:latest
    container_name: authz-connector-init
    depends_on:
      debezium:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts
    entrypoint: ["/bin/sh", "/scripts/setup.sh"]
    environment:
      CONNECT_URL: http://debezium:8083

  opa:
    image: openpolicyagent/opa:latest
    container_name: authz-opa
    ports:
      - "8181:8181"
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--set=decision_logs.console=true"
      - "/policy"
    volumes:
      - ./opa-policy:/policy

  sync-worker:
    build:
      context: ./scripts
      dockerfile: Dockerfile
    container_name: authz-sync-worker
    depends_on:
      debezium:
        condition: service_healthy
      opa:
        condition: service_started
      connector-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_DB: authz
      POSTGRES_USER: authz
      POSTGRES_PASSWORD: authz123
      OPA_URL: http://opa:8181
      TOPIC_PREFIX: authz.authz
    restart: unless-stopped

volumes:
  postgres_data: